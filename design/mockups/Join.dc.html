<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claim your handle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#061236}a:hover{color:#4B7A00}
.disp{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-0.02em;line-height:1.1;margin:0}
.mono{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#4c5265}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:5px;font-weight:500;font-size:16px;text-decoration:none}
input:focus{outline:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;font-family:'DM Sans',sans-serif;color:#061236;background:#FFFFFF;display:flex;flex-direction:column">
  <nav aria-label="Back" style="display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #f3f3f3">
    <a href="Calendar.dc.html" aria-label="Back to home" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#061236" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span class="mono" style="margin-left:4px">Heat 003 / Prospect Park / Nov 15 to 16</span>
  </nav>
  <div style="padding:32px 16px;display:flex;flex-direction:column;gap:20px;flex:1">
    <div style="font-size:12px;font-weight:700;letter-spacing:.1em;color:#4c5265">WELCOME TO HEATS / ONE TIME ONLY</div>
    <h1 class="disp" style="font-size:44px">Claim your @</h1>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="handle" class="mono">Your handle</label>
      <div style="display:flex;align-items:center;background:#FFFFFF;border:2px solid {{ring}};box-shadow:{{glow}};border-radius:8px;padding:0 14px;min-height:60px;gap:2px">
        <span class="disp" style="font-size:26px;color:#4c5265">@</span>
        <input id="handle" value="{{handle}}" onInput="{{onType}}" autocomplete="off" spellcheck="false" style="flex:1;border:0;font-size:22px;font-weight:600;font-family:'DM Sans',sans-serif;color:#061236;background:transparent;min-width:0">
        <sc-if value="{{ok}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4B7A00" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
      </div>
      <div style="font-size:14px;color:{{msgColor}};min-height:20px">{{msg}}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="email" class="mono">Email</label>
      <input id="email" type="email" placeholder="you@example.com" style="border:2px solid #e8e8e8;border-radius:8px;min-height:52px;padding:0 14px;font-size:16px;font-family:'DM Sans',sans-serif">
    </div>
    <div style="flex:1"></div>
    <a href="Verify.dc.html" class="btn" style="background:{{btnBg}};color:{{btnFg}}">Send my code</a>
    <a href="Verify.dc.html" style="text-align:center;font-size:14px;color:#4c5265;padding:6px">Already have an @? Sign in with your email</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { handle: 'the_subway_surfer' }; }
  check(h) {
    const taken = ['bagel.legs', 'reservoir_dog', 'harlem.hill', 'heats', 'admin'];
    const blocked = ['damn', 'crap'];
    if (h.length === 0) return ['', '#4c5265', false];
    if (!/^[a-z0-9._]+$/.test(h)) return ['Only letters, numbers, . and _', '#D93B3B', false];
    if (h.length < 3) return ['At least 3 characters', '#D93B3B', false];
    if (h.length > 20) return ['20 characters max', '#D93B3B', false];
    if (blocked.some((w) => h.includes(w))) return ['That handle isn’t allowed', '#D93B3B', false];
    if (taken.includes(h)) return ['@' + h + ' is taken', '#D93B3B', false];
    return ['@' + h + ' is yours', '#4B7A00', true];
  }
  renderVals() {
    const h = this.state.handle;
    const [msg, msgColor, ok] = this.check(h);
    return {
      handle: h, msg, msgColor, ok,
      ring: msg && !ok ? '#D93B3B' : '#CCFF00',
      glow: msg && !ok ? '0 0 0 4px #FBE3E3' : '0 0 0 4px #F2FFC4',
      btnBg: ok ? '#061236' : '#e8e8e8',
      btnFg: ok ? '#FFFFFF' : '#6b7180',
      onType: (e) => this.setState({ handle: e.target.value.toLowerCase().replace(/^@/, '') }),
    };
  }
}
</script>
</body>
</html>
