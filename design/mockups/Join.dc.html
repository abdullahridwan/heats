<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claim your handle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B0C0A}a:hover{color:#4B7A00}
.disp{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:112%;letter-spacing:-0.025em;line-height:1;margin:0}
.mono{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#5A5D55}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:6px;font-weight:600;font-size:16px;text-decoration:none}
input:focus{outline:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;font-family:'Geist',sans-serif;color:#0B0C0A;background:#FFFFFF;display:flex;flex-direction:column">
  <nav aria-label="Back" style="display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #ECEDE7">
    <a href="Landing-Phone.dc.html" aria-label="Back to home" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0C0A" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span class="mono" style="margin-left:4px">Heat 002 / Sat Nov 8</span>
  </nav>
  <div style="padding:32px 16px;display:flex;flex-direction:column;gap:20px;flex:1">
    <h1 class="disp" style="font-size:44px">Claim your @</h1>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="handle" class="mono">Your handle</label>
      <div style="display:flex;align-items:center;border:2px solid {{ring}};border-radius:8px;padding:0 14px;min-height:60px;gap:2px">
        <span class="disp" style="font-size:26px;color:#5A5D55">@</span>
        <input id="handle" value="{{handle}}" onInput="{{onType}}" autocomplete="off" spellcheck="false" style="flex:1;border:0;font-size:22px;font-weight:600;font-family:'Geist',sans-serif;color:#0B0C0A;background:transparent;min-width:0">
        <sc-if value="{{ok}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4B7A00" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
      </div>
      <div style="font-size:14px;color:{{msgColor}};min-height:20px">{{msg}}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="email" class="mono">Email</label>
      <input id="email" type="email" placeholder="you@example.com" style="border:1px solid #ECEDE7;border-radius:8px;min-height:52px;padding:0 14px;font-size:16px;font-family:'Geist',sans-serif">
    </div>
    <div style="flex:1"></div>
    <a href="Verify.dc.html" class="btn" style="background:{{btnBg}};color:#0B0C0A">Send my code</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { handle: 'the_subway_surfer' }; }
  check(h) {
    const taken = ['bagel.legs', 'reservoir_dog', 'harlem.hill', 'heats', 'admin'];
    const blocked = ['damn', 'crap'];
    if (h.length === 0) return ['', '#5A5D55', false];
    if (!/^[a-z0-9._]+$/.test(h)) return ['Only letters, numbers, . and _', '#D93B3B', false];
    if (h.length < 3) return ['At least 3 characters', '#D93B3B', false];
    if (h.length > 20) return ['20 characters max', '#D93B3B', false];
    if (blocked.some((w) => h.includes(w))) return ['That handle isn’t allowed', '#D93B3B', false];
    if (taken.includes(h)) return ['@' + h + ' is taken', '#D93B3B', false];
    return ['@' + h + ' is yours', '#4B7A00', true];
  }
  renderVals() {
    const h = this.state.handle;
    const [msg, msgColor, ok] = this.check(h);
    return {
      handle: h, msg, msgColor, ok,
      ring: ok ? '#CCFF00' : (msg ? '#D93B3B' : '#ECEDE7'),
      btnBg: ok ? '#CCFF00' : '#ECEDE7',
      onType: (e) => this.setState({ handle: e.target.value.toLowerCase().replace(/^@/, '') }),
    };
  }
}
</script>
</body>
</html>
